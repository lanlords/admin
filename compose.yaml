services:
  admin:
    build: .
    # Local development: share Docker's default bridge with game containers so
    # the backend can query their IPs. Production deployments override this.
    network_mode: bridge
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.yaml:/app/config.yaml:ro
      - ./templates:/app/templates:ro
    restart: unless-stopped
